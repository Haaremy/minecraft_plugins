core.arena.usage.header=<gold><bold>Arena commands:
core.arena.usage.create=<yellow>/arena create <name> <gameType> <gray>- create arena
core.arena.usage.delete=<yellow>/arena delete <name> <gray>- delete arena
core.arena.usage.list=<yellow>/arena list <gray>- list arenas
core.arena.usage.join=<yellow>/arena join <name> <gray>- join arena
core.arena.usage.leave=<yellow>/arena leave <gray>- leave arena
core.arena.usage.start=<yellow>/arena start <name> <gray>- start arena

