# hmyCore - English
# Format: MiniMessage tags <tag> or legacy &-codes via §
# Placeholders: {key}

# General
core.player_only=<red>This command is for players only!
core.no_permission=<red>No permission!

# Coins (/coins)
core.coins.show=<gray>Your coins: <gold>{coins} ⛁

# Lobby (/lobby)
core.lobby.connecting=<gray>Connecting to <yellow>{server}<gray>...

# Arena (/arena)
core.arena.create.usage=<red>Usage: /arena create <name> <gameType>
core.arena.create.ok=<green>Arena <yellow>{name} <green>created! (World: {world}, Type: {gameType})
core.arena.delete.usage=<red>Usage: /arena delete <name>
core.arena.delete.ok=<green>Arena <yellow>{name} <green>deleted!
core.arena.notfound=<red>Arena not found!
