name: HmyAI
version: "1"
main: de.haaremy.mc.hmyai.HmyAI
api-version: 1.20
description: Claude AI integration for Minecraft
author: Haaremy

commands:
  ai:
    description: "Fragt die KI etwas oder lässt sie auf dem Server handeln."
    usage: "/ai <Frage oder Aufgabe> | /ai reset"
    permission: hmy.ai

permissions:
  hmy.ai:
    description: "Erlaubt die Nutzung des /ai Befehls."
    default: op
